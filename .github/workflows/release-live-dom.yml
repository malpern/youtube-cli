name: Release Live DOM Gate

on:
  release:
    types:
      - published
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 25
          cache: npm

      - name: Validate release secrets
        env:
          YOUTUBE_WATCHLIST_STORAGE_STATE_JSON: ${{ secrets.YOUTUBE_WATCHLIST_STORAGE_STATE_JSON }}
        run: |
          if [[ -z "${YOUTUBE_WATCHLIST_STORAGE_STATE_JSON}" ]]; then
            echo "Missing required secret: YOUTUBE_WATCHLIST_STORAGE_STATE_JSON" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Write live DOM config
        env:
          YOUTUBE_WATCHLIST_STORAGE_STATE_JSON: ${{ secrets.YOUTUBE_WATCHLIST_STORAGE_STATE_JSON }}
          YOUTUBE_WATCHLIST_EXPECTED_ACCOUNT: ${{ secrets.YOUTUBE_WATCHLIST_EXPECTED_ACCOUNT }}
        run: |
          printf '%s' "${YOUTUBE_WATCHLIST_STORAGE_STATE_JSON}" > "$RUNNER_TEMP/youtube-storage-state.json"
          node <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");

          const runnerTemp = process.env.RUNNER_TEMP;
          const expectedAccount = process.env.YOUTUBE_WATCHLIST_EXPECTED_ACCOUNT || undefined;
          const config = {
            storageStatePath: path.join(runnerTemp, "youtube-storage-state.json"),
            headless: true,
            youtubeBaseUrl: "https://www.youtube.com",
            ...(expectedAccount ? { expectedAccount } : {})
          };

          fs.writeFileSync(
            path.join(runnerTemp, "youtube-live-dom-config.json"),
            `${JSON.stringify(config, null, 2)}\n`
          );
          EOF

      - name: Release build
        env:
          YOUTUBE_WATCHLIST_CONFIG: ${{ runner.temp }}/youtube-live-dom-config.json
        run: npm run build:release

      - name: Upload live DOM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-live-dom-runs
          path: runs/live-dom-smoke-*/
